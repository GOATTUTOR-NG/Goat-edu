<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Ibadan Life v2 — GTA Style Life Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050912;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

body{
  touch-action:none;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#88b96c;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 35%,#183b4c 0,#08131d 45%,#03070c 100%);
  transition:.5s;
}

.logo{
  font-size:clamp(32px,9vw,70px);
  font-weight:1000;
  letter-spacing:-3px;
  text-align:center;
}

.logo span{
  color:#72e36c;
}

.loading-sub{
  margin-top:8px;
  opacity:.65;
  font-size:13px;
}

.loading-bar{
  width:210px;
  height:5px;
  margin-top:28px;
  background:#20303d;
  border-radius:20px;
  overflow:hidden;
}

.loading-bar i{
  display:block;
  width:0;
  height:100%;
  background:#7df26e;
  animation:load 1.5s forwards;
}

@keyframes load{
  to{width:100%}
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
}

.top-left{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  left:10px;
  display:flex;
  gap:8px;
  align-items:center;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:linear-gradient(135deg,#71e76d,#1d7b51);
  display:grid;
  place-items:center;
  font-size:22px;
  border:2px solid rgba(255,255,255,.25);
  box-shadow:0 5px 20px #0008;
}

.player-card{
  background:#07111dcc;
  backdrop-filter:blur(12px);
  border:1px solid #ffffff15;
  border-radius:13px;
  padding:7px 11px;
  min-width:145px;
  box-shadow:0 8px 25px #0006;
}

.player-name{
  font-size:13px;
  font-weight:900;
}

.player-money{
  color:#83f17b;
  font-size:13px;
  font-weight:800;
  margin-top:2px;
}

.top-right{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  right:10px;
  display:flex;
  gap:7px;
  align-items:flex-start;
  pointer-events:auto;
}

.stat-pill{
  background:#07111ddd;
  border:1px solid #ffffff14;
  border-radius:12px;
  padding:7px 9px;
  font-size:11px;
  backdrop-filter:blur(12px);
}

#miniMap{
  width:92px;
  height:92px;
  background:#09131b;
  border:2px solid #ffffff22;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 8px 25px #0008;
}

.needs{
  position:absolute;
  left:10px;
  top:70px;
  width:min(190px,45vw);
  background:#07111dcc;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:8px;
  backdrop-filter:blur(12px);
}

.need{
  display:grid;
  grid-template-columns:20px 1fr 30px;
  gap:5px;
  align-items:center;
  font-size:10px;
  margin:4px 0;
}

.bar{
  height:6px;
  border-radius:20px;
  background:#1c2931;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  width:50%;
  border-radius:20px;
  background:#71e66c;
}

#locationBadge{
  position:absolute;
  top:calc(112px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  background:#07111ddd;
  padding:6px 12px;
  border-radius:30px;
  border:1px solid #ffffff18;
  font-size:11px;
  font-weight:800;
  backdrop-filter:blur(12px);
}

#context{
  position:absolute;
  left:50%;
  bottom:205px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:30px;
  background:#07111ded;
  border:1px solid #72e36c55;
  color:#bfffb9;
  font-size:12px;
  font-weight:900;
  display:none;
  white-space:nowrap;
}

#mission{
  position:absolute;
  top:calc(145px + env(safe-area-inset-top));
  right:10px;
  width:min(205px,48vw);
  padding:10px;
  border-radius:13px;
  background:#07111dcc;
  border:1px solid #ffffff15;
  backdrop-filter:blur(12px);
  display:none;
}

.mission-title{
  font-size:10px;
  text-transform:uppercase;
  color:#71e66c;
  font-weight:900;
}

.mission-text{
  margin-top:3px;
  font-size:11px;
  line-height:1.3;
}

#controls{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:30;
}

#joystick{
  position:absolute;
  left:17px;
  bottom:calc(22px + env(safe-area-inset-bottom));
  width:125px;
  height:125px;
  border-radius:50%;
  background:#07111d88;
  border:2px solid #ffffff1d;
  box-shadow:inset 0 0 30px #0007;
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:50%;
  top:50%;
  margin:-29px;
  border-radius:50%;
  background:#ffffff18;
  border:2px solid #ffffff30;
  box-shadow:0 8px 20px #0008;
}

.action-grid{
  position:absolute;
  right:12px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(2,58px);
  gap:8px;
  pointer-events:auto;
}

.action{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#07111ddd;
  border:1px solid #ffffff18;
  box-shadow:0 7px 20px #0009;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:19px;
}

.action small{
  font-size:8px;
  opacity:.8;
  font-weight:900;
}

.action.primary{
  background:#5ed45d;
  color:#041008;
}

.action.danger{
  background:#8d3030;
}

#phoneButton{
  position:absolute;
  right:145px;
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:62px;
  height:62px;
  border-radius:50%;
  background:#101d2aee;
  border:2px solid #ffffff20;
  font-size:25px;
  pointer-events:auto;
  box-shadow:0 8px 25px #0009;
}

#phone{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:#0007;
  backdrop-filter:blur(4px);
}

.phone-shell{
  width:min(430px,100%);
  height:min(760px,92vh);
  background:#08111a;
  border-radius:30px 30px 0 0;
  border:1px solid #ffffff18;
  box-shadow:0 -20px 60px #000b;
  padding:17px;
  overflow:hidden;
  animation:phoneUp .25s ease;
}

@keyframes phoneUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.phone-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.phone-title{
  font-size:20px;
  font-weight:1000;
}

.close{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ffffff12;
  font-size:18px;
}

.phone-screen{
  height:calc(100% - 55px);
  overflow:auto;
  padding-bottom:20px;
}

.app-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.app{
  aspect-ratio:1;
  border-radius:19px;
  background:linear-gradient(145deg,#13222f,#0b151f);
  border:1px solid #ffffff12;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:25px;
}

.app span{
  font-size:10px;
  font-weight:800;
  opacity:.85;
}

.panel{
  background:#0d1924;
  border:1px solid #ffffff12;
  border-radius:17px;
  padding:13px;
  margin-bottom:10px;
}

.panel h3{
  margin:0 0 10px;
  font-size:14px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #ffffff0b;
}

.item:last-child{
  border-bottom:0;
}

.item-info{
  flex:1;
}

.item-name{
  font-weight:850;
  font-size:12px;
}

.item-desc{
  font-size:10px;
  opacity:.58;
  margin-top:3px;
}

.btn{
  background:#62dc63;
  color:#041007;
  padding:8px 10px;
  border-radius:10px;
  font-weight:900;
  font-size:10px;
}

.btn.dark{
  background:#ffffff10;
  color:#fff;
}

.btn.red{
  background:#8f3434;
  color:#fff;
}

.btn.blue{
  background:#4387e8;
}

.phone-back{
  margin-bottom:10px;
  width:100%;
  text-align:left;
  background:#ffffff0c;
  padding:9px;
  border-radius:10px;
  font-size:11px;
}

#modal{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  background:#0009;
  padding:15px;
}

.modal-box{
  width:min(440px,100%);
  max-height:88vh;
  overflow:auto;
  background:#08121c;
  border:1px solid #ffffff1a;
  border-radius:23px;
  padding:18px;
  box-shadow:0 20px 80px #000;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:calc(155px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  z-index:500;
  background:#07111ded;
  border:1px solid #72e36c55;
  padding:11px 15px;
  border-radius:13px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  transition:.25s;
  pointer-events:none;
  text-align:center;
  max-width:85vw;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

#interiorBar{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:90;
  display:none;
  background:#07111dee;
  border:1px solid #ffffff20;
  border-radius:18px;
  padding:14px;
  min-width:220px;
  text-align:center;
  box-shadow:0 20px 70px #000;
}

#activity{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  background:#02060aee;
  align-items:center;
  justify-content:center;
}

.activity-card{
  width:min(390px,90%);
  background:#0b1721;
  border:1px solid #ffffff18;
  border-radius:24px;
  padding:22px;
  text-align:center;
}

.activity-icon{
  font-size:60px;
}

.activity-title{
  font-size:21px;
  font-weight:1000;
  margin-top:8px;
}

.activity-desc{
  opacity:.7;
  font-size:12px;
  line-height:1.5;
  margin:8px 0 18px;
}

.progress{
  width:100%;
  height:9px;
  border-radius:20px;
  background:#182732;
  overflow:hidden;
}

.progress i{
  display:block;
  width:0;
  height:100%;
  background:#6be469;
}

#keyboard{
  display:none;
  position:fixed;
  inset:auto 0 0;
  z-index:300;
  background:#111820;
  padding:8px;
}

.keyrow{
  display:flex;
  gap:5px;
  margin:4px 0;
}

.key{
  flex:1;
  height:43px;
  border-radius:7px;
  background:#26323c;
  color:white;
  font-size:13px;
}

.key.special{
  flex:1.5;
}

#pause{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  align-items:center;
  justify-content:center;
  background:#02060acc;
  backdrop-filter:blur(10px);
}

.pause-box{
  width:min(380px,90%);
  background:#09131d;
  border:1px solid #ffffff18;
  border-radius:24px;
  padding:25px;
  text-align:center;
}

.pause-box h1{
  margin:0;
  font-size:30px;
}

.pause-buttons{
  display:grid;
  gap:9px;
  margin-top:20px;
}

.pause-buttons button{
  padding:14px;
  border-radius:13px;
  background:#ffffff0c;
  font-weight:900;
}

.pause-buttons button:first-child{
  background:#68dc66;
  color:#041006;
}

@media(min-width:700px){
  .action-grid{
    grid-template-columns:repeat(4,58px);
  }
}
</style>
</head>

<body>

<div id="loading">
  <div class="logo">IBADAN <span>LIFE</span></div>
  <div class="loading-sub">LIVE YOUR STORY • v2.0</div>
  <div class="loading-bar"><i></i></div>
</div>

<canvas id="game"></canvas>

<div id="hud">

  <div class="top-left">
    <div class="avatar">🧑🏾</div>
    <div class="player-card">
      <div class="player-name" id="hudName">David</div>
      <div class="player-money" id="hudMoney">₦50,000</div>
    </div>
  </div>

  <div class="top-right">
    <div class="stat-pill" id="timeLabel">08:00 AM</div>
    <div class="stat-pill" id="weatherLabel">☀️ Clear</div>
  </div>

  <div class="needs">
    <div class="need"><span>🍗</span><div class="bar"><i id="hungerBar"></i></div><b id="hungerText">80</b></div>
    <div class="need"><span>⚡</span><div class="bar"><i id="energyBar"></i></div><b id="energyText">80</b></div>
    <div class="need"><span>🚿</span><div class="bar"><i id="hygieneBar"></i></div><b id="hygieneText">80</b></div>
    <div class="need"><span>🎮</span><div class="bar"><i id="funBar"></i></div><b id="funText">70</b></div>
    <div class="need"><span>👥</span><div class="bar"><i id="socialBar"></i></div><b id="socialText">65</b></div>
  </div>

  <div id="locationBadge">Family House</div>

  <div id="mission">
    <div class="mission-title">ACTIVE MISSION</div>
    <div class="mission-text" id="missionText">Get ready for your day.</div>
  </div>

  <div id="miniMap">
    <canvas id="mapCanvas" width="180" height="180"></canvas>
  </div>

  <div id="context">Tap ACTION</div>
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="phoneButton">📱</button>

  <div class="action-grid">
    <button class="action primary" id="actButton">🖐️<small>ACTION</small></button>
    <button class="action" id="runButton">🏃🏾<small>RUN</small></button>
    <button class="action" id="vehicleButton">🚗<small>VEHICLE</small></button>
    <button class="action" id="cameraButton">🎥<small>VIEW</small></button>
    <button class="action" id="pauseButton">⏸️<small>PAUSE</small></button>
    <button class="action" id="sleepButton">💤<small>SLEEP</small></button>
    <button class="action" id="socialButton">👋🏾<small>SOCIAL</small></button>
    <button class="action" id="mapButton">🗺️<small>MAP</small></button>
  </div>

</div>

<div id="phone">
  <div class="phone-shell">
    <div class="phone-top">
      <div class="phone-title">📱 MyPhone</div>
      <button class="close" id="closePhone">×</button>
    </div>
    <div class="phone-screen" id="phoneScreen"></div>
  </div>
</div>

<div id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="activity">
  <div class="activity-card">
    <div class="activity-icon" id="activityIcon">🍲</div>
    <div class="activity-title" id="activityTitle">Eating</div>
    <div class="activity-desc" id="activityDesc">
      You are enjoying a proper Nigerian meal.
    </div>
    <div class="progress"><i id="activityProgress"></i></div>
  </div>
</div>

<div id="interiorBar">
  <div id="interiorText">You are inside.</div>
</div>

<div id="toast"></div>

<div id="pause">
  <div class="pause-box">
    <h1>IBADAN LIFE</h1>
    <p style="opacity:.6">Game paused</p>
    <div class="pause-buttons">
      <button id="resumeButton">▶ RESUME</button>
      <button id="saveButton">💾 SAVE GAME</button>
      <button id="restartButton">↻ NEW LIFE</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   IBADAN LIFE v2
   MOBILE-FIRST GTA-STYLE LIFE SIMULATOR
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const mapCanvas = document.getElementById("mapCanvas");
const mapCtx = mapCanvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

   WORLD
   ========================================================= */

const buildings=[

    enterable:true,
    color:"#c9a66b"
  },
  {

    x:1510,y:970,w:290,h:200,
    type:"hall",
    enterable:true,

  },
  {

  {

  {

  }

const landmarks=[

function createMission(){

  state.missionProgress=0;
  state.missionReward=state.mission.reward;
  updateMission();
}

function updateMission(){
  if(!state.mission)return;

  document.getElementById("mission").style.display="block";
  document.getElementById("missionText").textContent=
    state.mission.text+"  •  "+state.missionProgress+"/"+state.mission.target;

  if(state.missionProgress>=state.mission.target){
    rewardMission();
  }
}

function progressMission(type,value=1){
  if(!state.mission)return;
  if(state.mission.type===type){
    state.missionProgress+=value;
    updateMission();
  }
}

function rewardMission(){
  const reward=state.missionReward;

  state.xp+=20;
  toast("🎯 Mission complete! +₦"+money(reward));
  state.mission=null;
  setTimeout(createMission,1800);
}

function money(n){
  return "₦"+Math.round(n).toLocaleString("en-NG");
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function saveGame(){
  localStorage.setItem("ibadanLifeV2",JSON.stringify(state));
  toast("💾 Game saved.");
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}

function spend(amount){
  if(state.cash<amount){
    toast("❌ You don't have enough cash.");
    return false;
  }
  state.cash-=amount;
  state.totalSpent+=amount;
  return true;
}

function earn(amount){
  state.cash+=amount;
  state.totalEarned+=amount;
  state.xp+=Math.ceil(amount/1000);
  checkLevel();
}

function checkLevel(){
  const needed=state.level*100;
  if(state.xp>=needed){
    state.xp-=needed;
    state.level++;
    state.reputation++;
    toast("⭐ LEVEL UP! You are now level "+state.level);
  }
}

let lastTime=performance.now();

function updateTime(dt){
  state.minute+=dt*0.65;

  if(state.minute>=60){
    state.minute-=60;
    state.hour++;
  }

  if(state.hour>=24){
    state.hour=0;
    state.day++;
  }

  if(Math.random()<0.00015){
    state.weather=pick(["clear","clear","cloudy","rain"]);
  }
}

function timeText(){
  let h=state.hour;
  const suffix=h>=12?"PM":"AM";
  h=h%12;
  if(h===0)h=12;
  return String(h).padStart(2,"0")+":"+String(Math.floor(state.minute)).padStart(2,"0")+" "+suffix;
}

function isNight(){
  return state.hour>=19 || state.hour<6;
}

function nearestBuilding(){
  let best=null;
  let dist=Infinity;

  for(const b of buildings){
    const cx=b.x+b.w/2;
    const cy=b.y+b.h/2;
    const d=Math.hypot(player.x-cx,player.y-cy);
    if(d<dist){
      dist=d;
      best=b;
    }
  }

  return dist<150?best:null;
}

/* =========================================================
   VEHICLE SYSTEM
   ========================================================= */

function nearestTraffic(){
  let best=null,d=Infinity;

  for(const v of traffic){
    const dist=Math.hypot(player.x-v.x,player.y-v.y);
    if(dist<d){
      d=dist;
      best=v;
    }
  }

  return d<110?best:null;
}

function nearestOwnedVehicle(){
  let best=null,d=Infinity;

  for(const v of traffic){
    const dist=Math.hypot(player.x-v.x,player.y-v.y);
    if(dist<d){
      d=dist;
      best=v;
    }
  }

  return d<110?best:null;
}

function boardVehicle(v){
  if(!v){
    toast("No vehicle nearby.");
    return;
  }

  player.vehicle=v;
  v.occupied=true;
  player.x=v.x;
  player.y=v.y;

  toast("🚗 Boarded "+v.type.name);
  progressMission("drive");
}

function exitVehicle(){
  if(!player.vehicle)return;

  player.vehicle.occupied=false;
  player.vehicle=null;
  toast("🚶 You left the vehicle.");
}

function updateVehicle(dt){
  if(!player.vehicle)return;

  const v=player.vehicle;
  const speed=v.type.speed*(player.run?1.35:1);

  if(Math.abs(keys.x)+Math.abs(keys.y)>0){
    const len=Math.hypot(keys.x,keys.y)||1;
    v.x+=keys.x/len*speed;
    v.y+=keys.y/len*speed;

    v.x=clamp(v.x,20,WORLD_W-20);
    v.y=clamp(v.y,20,WORLD_H-20);

    player.x=v.x;
    player.y=v.y;

    v.angle=Math.atan2(keys.y,keys.x);
  }
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(dt){
  if(player.inBuilding || player.vehicle){
    updateVehicle(dt);
    return;
  }

  const magnitude=Math.hypot(keys.x,keys.y);

  if(magnitude<.01){
    player.moving=false;
    return;
  }

  const speed=(player.run?3.8:2.4);

  const len=Math.max(1,magnitude);

  player.x+=keys.x/len*speed;
  player.y+=keys.y/len*speed;

  player.x=clamp(player.x,25,WORLD_W-25);
  player.y=clamp(player.y,25,WORLD_H-25);

  player.angle=Math.atan2(keys.y,keys.x);
  player.moving=true;
}

/* =========================================================
   WORLD RENDERING
   ========================================================= */

function worldToScreen(x,y){
  return {
    x:(x-camera.x)*camera.zoom+W/2,
    y:(y-camera.y)*camera.zoom+H/2
  };
}

function screenToWorld(x,y){
  return {
    x:(x-W/2)/camera.zoom+camera.x,
    y:(y-H/2)/camera.zoom+camera.y
  };
}

function drawWorld(){
  ctx.fillStyle="#82a967";
  ctx.fillRect(0,0,W,H);

  ctx.save();

  // camera
  ctx.translate(W/2-camera.x*camera.zoom,H/2-camera.y*camera.zoom);
  ctx.scale(camera.zoom,camera.zoom);

  drawTerrain();
  drawRoads();
  drawStreetDetails();
  drawBuildings();
  drawLandmarks();
  drawNPCs();
  drawTraffic();
  drawPlayer();

  ctx.restore();

  drawWeather();
  drawNight();
}

function drawTerrain(){
  for(const d of districts){
    ctx.fillStyle=d.color;
    ctx.fillRect(d.x,d.y,d.w,d.h);

    // grass patches
    ctx.fillStyle="#ffffff08";
    for(let i=0;i<10;i++){
      const x=d.x+Math.random()*d.w;
      const y=d.y+Math.random()*d.h;
      ctx.fillRect(x,y,50,30);
    }
  }

  // dirt paths
  ctx.strokeStyle="#8b805e";
  ctx.lineWidth=25;
  ctx.globalAlpha=.3;

  for(let i=0;i<12;i++){
    ctx.beginPath();
    ctx.moveTo(rand(0,WORLD_W),rand(0,WORLD_H));
    ctx.lineTo(rand(0,WORLD_W),rand(0,WORLD_H));
    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawRoads(){
  for(const r of roads){
    ctx.fillStyle="#353b3d";
    ctx.fillRect(r.x,r.y,r.w,r.h);

    ctx.fillStyle="#4a4f50";

    if(r.w>r.h){
      ctx.fillRect(r.x,r.y,r.w,8);
      ctx.fillRect(r.x,r.y+r.h-8,r.w,8);

      ctx.strokeStyle="#d5b54a";
      ctx.lineWidth=4;
      ctx.setLineDash([30,30]);
      ctx.beginPath();
      ctx.moveTo(r.x,r.y+r.h/2);
      ctx.lineTo(r.x+r.w,r.y+r.h/2);
      ctx.stroke();
      ctx.setLineDash([]);
    }else{
      ctx.fillRect(r.x,r.y,8,r.h);
      ctx.fillRect(r.x+r.w-8,r.y,8,r.h);

      ctx.strokeStyle="#d5b54a";
      ctx.lineWidth=4;
      ctx.setLineDash([30,30]);
      ctx.beginPath();
      ctx.moveTo(r.x+r.w/2,r.y);
      ctx.lineTo(r.x+r.w/2,r.y+r.h);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // zebra crossings
  for(const x of [720,1200,2050,2900,3250]){
    for(let i=0;i<8;i++){
      ctx.fillStyle="#ffffffb8";
      ctx.fillRect(x-40+i*11,675,6,60);
      ctx.fillRect(x-40+i*11,1445,6,60);
    }
  }
}

function drawStreetDetails(){
  // utility poles
  for(let x=180;x<WORLD_W;x+=250){
    for(let y=180;y<WORLD_H;y+=360){
      ctx.fillStyle="#493b2e";
      ctx.fillRect(x,y,6,55);

      ctx.strokeStyle="#493b2e";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(x-35,y+10);
      ctx.lineTo(x+40,y+10);
      ctx.stroke();
    }
  }

  // trees
  for(let i=0;i<90;i++){
    const x=(i*317)%WORLD_W;
    const y=(i*193)%WORLD_H;

    if(isOnRoad(x,y))continue;

    ctx.fillStyle="#68472f";
    ctx.fillRect(x-3,y,6,22);

    ctx.fillStyle=i%2?"#2d7540":"#3d8847";
    ctx.beginPath();
    ctx.arc(x,y,17,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ffffff08";
    ctx.beginPath();
    ctx.arc(x-5,y-5,10,0,Math.PI*2);
    ctx.fill();
  }
}

function isOnRoad(x,y){
  return roads.some(r=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h);
}

function drawBuildings(){
  for(const b of buildings){
    ctx.fillStyle="#0005";
    ctx.fillRect(b.x+10,b.y+14,b.w,b.h);

    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);

    // roof
    ctx.fillStyle="#503d32";
    ctx.beginPath();
    ctx.moveTo(b.x-10,b.y);
    ctx.lineTo(b.x+b.w/2,b.y-35);
    ctx.lineTo(b.x+b.w+10,b.y);
    ctx.closePath();
    ctx.fill();

    // windows
    for(let xx=b.x+25;xx<b.x+b.w-15;xx+=48){
      for(let yy=b.y+30;yy<b.y+b.h-40;yy+=48){
        ctx.fillStyle="#6d9eb7";
        ctx.fillRect(xx,yy,22,18);
        ctx.fillStyle="#ffffff18";
        ctx.fillRect(xx+2,yy+2,8,6);
      }
    }

    // door
    ctx.fillStyle="#5b3c2b";
    ctx.fillRect(b.x+b.w/2-15,b.y+b.h-40,30,40);

    // sign
    ctx.fillStyle="#111c";
    ctx.fillRect(b.x+10,b.y+8,b.w-20,22);
    ctx.fillStyle="#fff";
    ctx.font="bold 11px system-ui";
    ctx.textAlign="center";
    ctx.fillText(b.name,b.x+b.w/2,b.y+24);
    ctx.textAlign="left";

    if(b.enterable){
      ctx.fillStyle="#72e36c";
      ctx.beginPath();
      ctx.arc(b.x+b.w/2,b.y+b.h+12,6,0,Math.PI*2);
      ctx.fill();
    }
  }
}

function drawLandmarks(){
  for(const l of landmarks){
    ctx.fillStyle="#0005";
    ctx.beginPath();
    ctx.ellipse(l.x,l.y+25,45,16,0,0,Math.PI*2);
    ctx.fill();

    ctx.font="42px serif";
    ctx.textAlign="center";
    ctx.fillText(l.emoji,l.x,l.y);

    ctx.font="bold 11px system-ui";
    ctx.fillStyle="#fff";
    ctx.fillText(l.name,l.x,l.y+42);
  }

  ctx.textAlign="left";
}

function drawNPCs(){
  for(const n of npcs){
    const walking=Math.hypot(n.vx,n.vy)>.2;
    const bounce=walking?Math.sin(performance.now()/120+n.x)*2:0;

    ctx.save();
    ctx.translate(n.x,n.y+bounce);

    // shadow
    ctx.fillStyle="#0005";
    ctx.beginPath();
    ctx.ellipse(0,15,12,5,0,0,Math.PI*2);
    ctx.fill();

    // legs
    ctx.strokeStyle="#2d2d35";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(-4,8);
    ctx.lineTo(-6,20);
    ctx.moveTo(4,8);
    ctx.lineTo(6,20);
    ctx.stroke();

    // body
    ctx.fillStyle=n.shirt;
    ctx.fillRect(-9,-5,18,18);

    // head
    ctx.fillStyle=n.skin;
    ctx.beginPath();
    ctx.arc(0,-15,8,0,Math.PI*2);
    ctx.fill();

    // hair
    ctx.fillStyle="#201611";
    ctx.beginPath();
    ctx.arc(0,-19,8,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

function drawTraffic(){
  for(const v of traffic){
    ctx.save();
    ctx.translate(v.x,v.y);
    ctx.rotate(v.angle||0);

    const w=v.type.id==="keke"?32:48;
    const h=v.type.id==="keke"?20:25;

    ctx.fillStyle="#0006";
    ctx.fillRect(-w/2+5,-h/2+6,w,h);

    ctx.fillStyle=v.type.color;
    ctx.fillRect(-w/2,-h/2,w,h);

    // windows
    ctx.fillStyle="#263b4a";
    ctx.fillRect(-w/2+7,-h/2+4,w-14,h-9);

    // wheels
    ctx.fillStyle="#151515";
    ctx.fillRect(-w/2-3,-h/2-3,7,7);
    ctx.fillRect(w/2-4,-h/2-3,7,7);
    ctx.fillRect(-w/2-3,h/2-4,7,7);
    ctx.fillRect(w/2-4,h/2-4,7,7);

    ctx.restore();
  }
}

function drawPlayer(){
  if(player.vehicle)return;

  const bob=player.moving?Math.sin(performance.now()/100)*2:0;

  ctx.save();
  ctx.translate(player.x,player.y+bob);

  ctx.fillStyle="#0006";
  ctx.beginPath();
  ctx.ellipse(0,19,15,6,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#161b23";
  ctx.lineWidth=6;

  ctx.beginPath();
  ctx.moveTo(-5,9);
  ctx.lineTo(-7,22);
  ctx.moveTo(5,9);
  ctx.lineTo(7,22);
  ctx.stroke();

  ctx.fillStyle="#2673d9";
  ctx.fillRect(-11,-8,22,21);

  ctx.fillStyle="#8c5b40";
  ctx.beginPath();
  ctx.arc(0,-19,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#21160f";
  ctx.beginPath();
  ctx.arc(0,-23,10,Math.PI,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="bold 10px system-ui";
  ctx.textAlign="center";
  ctx.fillText(state.name,0,-35);

  ctx.restore();
}

/* =========================================================
   WEATHER / NIGHT
   ========================================================= */

function drawWeather(){
  if(state.weather==="rain"){
    ctx.strokeStyle="#86bde866";
    ctx.lineWidth=1;

    for(let i=0;i<180;i++){
      const x=(i*97+performance.now()/4)%W;
      const y=(i*53+performance.now()/2)%H;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-4,y+13);
      ctx.stroke();
    }
  }

  if(state.weather==="cloudy"){
    ctx.fillStyle="#26364333";
    ctx.fillRect(0,0,W,H);
  }
}

function drawNight(){
  if(!isNight())return;

  let alpha=.58;

  if(state.hour>=5&&state.hour<7)alpha=.25;
  if(state.hour>=19&&state.hour<21)alpha=.35;

  ctx.fillStyle=`rgba(5,10,30,${alpha})`;
  ctx.fillRect(0,0,W,H);

  // street lights
  ctx.globalCompositeOperation="screen";

  for(let x=0;x<W;x+=150){
    const y=H*.45;
    const gradient=ctx.createRadialGradient(x,y,0,x,y,70);
    gradient.addColorStop(0,"rgba(255,215,120,.15)");
    gradient.addColorStop(1,"rgba(255,215,120,0)");
    ctx.fillStyle=gradient;
    ctx.fillRect(x-70,y-70,140,140);
  }

  ctx.globalCompositeOperation="source-over";
}

/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){
  let targetX=player.x;
  let targetY=player.y;

  if(cameraMode===1){
    targetX+=Math.cos(player.angle)*150;
    targetY+=Math.sin(player.angle)*150;
  }

  camera.x+=(targetX-camera.x)*.08;
  camera.y+=(targetY-camera.y)*.08;

  const viewW=W/camera.zoom;
  const viewH=H/camera.zoom;

  camera.x=clamp(camera.x,viewW/2,WORLD_W-viewW/2);
  camera.y=clamp(camera.y,viewH/2,WORLD_H-viewH/2);
}

/* =========================================================
   MINIMAP
   ========================================================= */

function drawMinimap(){
  mapCtx.clearRect(0,0,180,180);

  mapCtx.fillStyle="#15251a";
  mapCtx.fillRect(0,0,180,180);

  const sx=180/WORLD_W;
  const sy=180/WORLD_H;

  for(const r of roads){
    mapCtx.fillStyle="#555c5c";
    mapCtx.fillRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy);
  }

  for(const b of buildings){
    mapCtx.fillStyle=b.id==="home"?"#74df69":"#9b8060";
    mapCtx.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);
  }

  mapCtx.fillStyle="#70ef65";
  mapCtx.beginPath();
  mapCtx.arc(player.x*sx,player.y*sy,4,0,Math.PI*2);
  mapCtx.fill();

  mapCtx.strokeStyle="#70ef65";
  mapCtx.beginPath();
  mapCtx.moveTo(player.x*sx,player.y*sy);
  mapCtx.lineTo(
    (player.x+Math.cos(player.angle)*20)*sx,
    (player.y+Math.sin(player.angle)*20)*sy
  );
  mapCtx.stroke();
}

/* =========================================================
   LOCATION
   ========================================================= */

function updateLocation(){
  let found="Ibadan";

  if(player.inBuilding){
    const b=buildings.find(x=>x.id===player.inBuilding);
    if(b)found=b.name;
  }else{
    for(const d of districts){
      if(player.x>d.x&&player.x<d.x+d.w&&player.y>d.y&&player.y<d.y+d.h){
        found=d.name;
        break;
      }
    }
  }

  if(state.location!==found){
    state.location=found;

    if(state.mission?.type==="visit" &&
       state.mission.target===found){
      progressMission("visit");
    }
  }

  document.getElementById("locationBadge").textContent=found;
}

function updateContext(){
  const el=document.getElementById("context");

  if(player.inBuilding){
    const b=buildings.find(x=>x.id===player.inBuilding);

    if(b?.id==="home"){
      el.textContent="🛋️ Tap ACTION to interact • Decorate with 📱";
    }else{
      el.textContent="🚪 Tap ACTION to interact • Exit below";
    }

    el.style.display="block";

  const b=nearestBuilding();
  const v=nearestTraffic();

  if(b){
    el.textContent="🚪 Tap ACTION — Enter "+b.name;
    el.style.display="block";
  }else if(v){
    el.textContent="🚗 Tap VEHICLE — Board "+v.type.name;
    el.style.display="block";
  }else{
    el.style.display="none";
  }
}

/* =========================================================
   ACTION SYSTEM
   ========================================================= */

function doAction(){
  if(player.inBuilding){
    interactInside();
    return;
  }

  const b=nearestBuilding();

  if(b){
    enterBuilding(b);
    return;
  }

  const v=nearestTraffic();

  if(v){
    boardVehicle(v);
    return;
  }

  toast("Nothing useful nearby. Explore Ibadan.");
}

function interactInside(){
  const b=buildings.find(x=>x.id===player.inBuilding);
  if(!b)return;

  if(b.id==="home"){
    openHomeActions();
    return;
  }

  if(b.type==="market"){
    openMarket();
    return;
  }

  if(b.type==="school"){
    studyActivity();
    return;
  }

  if(b.type==="hotel"){
    sleepActivity();
    return;
  }

  if(b.type==="hospital"){
    healthActivity();
    return;
  }

  if(b.type==="bank"){
    openPhonePage("bank");
    return;
  }

  if(b.type==="restaurant"){
    eatActivity();
    return;
  }

  if(b.type==="hall"){
    socialActivity();
    return;
  }

  if(b.type==="shop"){
    openShop();
    return;
  }

  toast("You look around the building.");
}

   ========================================================= */

function startActivity(icon,title,desc,duration,finish){
  if(activeActivity){
    toast("You are already doing something.");
    return;
  }

  activeActivity=true;

  document.getElementById("activity").style.display="flex";
  document.getElementById("activityIcon").textContent=icon;
  document.getElementById("activityTitle").textContent=title;
  document.getElementById("activityDesc").textContent=desc;

  const bar=document.getElementById("activityProgress");
  bar.style.width="0%";

  const start=performance.now();

  function tick(now){
    const p=clamp((now-start)/duration,0,1);
    bar.style.width=(p*100)+"%";

    if(p<1){
      activityTimer=requestAnimationFrame(tick);
    }else{
      activeActivity=false;
      document.getElementById("activity").style.display="none";
      finish();
      saveGame();
      updateHUD();
    }
  }

  activityTimer=requestAnimationFrame(tick);
}

/* =========================================================
   MOBILE JOYSTICK
   ========================================================= */

let joystickActive=false;
let joystickCenter={x:0,y:0};

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickStart(e){
  joystickActive=true;

  const r=joystick.getBoundingClientRect();
  joystickCenter={
    x:r.left+r.width/2,
    y:r.top+r.height/2
  };

  joystickMove(e);
}

function joystickMove(e){
  if(!joystickActive)return;

  const p=e.touches?e.touches[0]:e;

  let dx=p.clientX-joystickCenter.x;
  let dy=p.clientY-joystickCenter.y;

  const max=45;
  const len=Math.hypot(dx,dy);

  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }

  stick.style.transform=`translate(${dx}px,${dy}px)`;

  keys.x=dx/max;
  keys.y=dy/max;
}

function joystickEnd(){
  joystickActive=false;
  keys.x=0;
  keys.y=0;
  stick.style.transform="translate(0,0)";
}

joystick.addEventListener("touchstart",joystickStart,{passive:false});
joystick.addEventListener("touchmove",joystickMove,{passive:false});
joystick.addEventListener("touchend",joystickEnd);
joystick.addEventListener("touchcancel",joystickEnd);

/* =========================================================
   TOUCH TAP / INTERACTION
   ========================================================= */

canvas.addEventListener("touchend",e=>{
  if(e.touches.length)return;

  const touch=e.changedTouches[0];

  // Don't interfere with joystick area.
  if(touch.clientX<160 && touch.clientY>H-180)return;

  // Tap world to move.
  if(!phoneOpen && !player.inBuilding){
    const p=screenToWorld(touch.clientX,touch.clientY);

    const dx=p.x-player.x;
    const dy=p.y-player.y;
    const len=Math.hypot(dx,dy)||1;

    keys.x=dx/len;
    keys.y=dy/len;

    setTimeout(()=>{
      keys.x=0;
      keys.y=0;
    },550);
  }
},{passive:true});

/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(now){
  const dt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;

  if(!gamePaused && !phoneOpen){

    updateTime(dt);
    updateNeeds(dt);
    updatePlayer(dt);
    updateTraffic(dt);
    updateNPCs(dt);
    updateCamera();
    updateLocation();
    updateContext();

    drawMinimap();
    updateHUD();

    if(player.inBuilding){
      const b=buildings.find(x=>x.id===player.inBuilding);
      drawInterior(b);
    }else{
      drawWorld();
    }

  }else{
    // Still draw static screen while paused.
    if(player.inBuilding){
      const b=buildings.find(x=>x.id===player.inBuilding);
      drawInterior(b);
    }else{
      drawWorld();
    }
  }

  requestAnimationFrame(gameLoop);
}

/* =========================================================
   STARTUP
   ========================================================= */

function boot(){
  setTimeout(()=>{
    document.getElementById("loading").style.opacity="0";

    setTimeout(()=>{
      document.getElementById("loading").style.display="none";
    },500);

    if(!state.mission)createMission();

    player.x=360;
    player.y=500;

    toast("👋🏾 Welcome to Ibadan Life.");
  },1600);
}

window.addEventListener("beforeunload",saveGame);

boot();
requestAnimationFrame(gameLoop);
